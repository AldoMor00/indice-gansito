name: ingesta

# Baja las dos fuentes y las commitea en indice-gansito-datos, cada una bajo su
# directorio. Un script por fuente: ver decisión #9.
#
# Profeco: el backfill y el cron son la misma corrida —el manifiesto dice qué falta y
# `max` limita la tanda—. CONASAMI no tiene backfill: son dos archivos que se bajan
# siempre y se escriben sólo si su sha256 cambió.

on:
  schedule:
    # Semanal. Era diario, con una razón que ya no se sostiene: Profeco publicaba sin
    # calendario fijo y sondear dos veces al mes podía dejar una quincena esperando dos
    # semanas. Pero el programa no publica desde `11-2025_02` y el dataset de 2026 no
    # existe en el catálogo, así que no hay nada que alcanzar (ver docs/fuentes.md). Se
    # sigue sondeando por si vuelve; enterarse seis días tarde de una fuente parada nueve
    # meses no cuesta nada. A CONASAMI, que publica una vez al año, semanal le sobra.
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      max:
        description: 'Cuántas quincenas de Profeco procesar en esta tanda'
        default: '5'

permissions:
  contents: read

concurrency:
  group: ingesta
  cancel-in-progress: false

# Un job por fuente, no un job con dos pasos: si Profeco truena —un 403 del CDN, un
# esquema que cambió— CONASAMI no tiene por qué caerse con él. Van encadenados con
# `needs` para que no se peleen por el push al mismo repo, y `!cancelled()` es lo que
# deja correr el segundo aunque el primero haya fallado.
jobs:
  profeco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clona la zona raw
        uses: actions/checkout@v7
        with:
          repository: AldoMor00/indice-gansito-datos
          # Deploy key con escritura sólo en ese repo: no cuelga de ninguna cuenta.
          ssh-key: ${{ secrets.DATOS_DEPLOY_KEY }}
          path: datos

      - name: Instala uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Procesa la tanda
        id: ingesta
        run: uv run --python 3.11 scripts/ingesta_profeco.py --destino datos --max "${{ inputs.max || 5 }}"

      - name: Commitea los cortes
        if: steps.ingesta.outputs.procesadas != ''
        working-directory: datos
        env:
          PROCESADAS: ${{ steps.ingesta.outputs.procesadas }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profeco
          git commit -m "Agrega los cortes de $PROCESADAS"
          git push

  conasami:
    needs: profeco
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clona la zona raw
        uses: actions/checkout@v7
        with:
          repository: AldoMor00/indice-gansito-datos
          ssh-key: ${{ secrets.DATOS_DEPLOY_KEY }}
          path: datos

      - name: Instala uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Revisa si cambiaron los archivos
        id: ingesta
        run: uv run --python 3.11 scripts/ingesta_conasami.py --destino datos

      - name: Commitea las versiones nuevas
        if: steps.ingesta.outputs.actualizados != ''
        working-directory: datos
        env:
          ACTUALIZADOS: ${{ steps.ingesta.outputs.actualizados }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conasami
          git commit -m "Actualiza CONASAMI: $ACTUALIZADOS"
          git push
