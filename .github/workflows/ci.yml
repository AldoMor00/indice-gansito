name: ci

# Sólo cubre el Python que corre en Actions. El que corre en Fabric se prueba en
# nb_90_pruebas, dentro del notebook: ver decisión #7. De `fabric/` aquí no se revisa
# el código sino la metadata: que ningún notebook traiga lakehouse por defecto.

on:
  push:
    branches: [dev, main]
    paths: &python
      - 'scripts/**'
      - 'tests/**'
      - 'fabric/**'
      - 'objetivo.yml'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *python

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instala uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: uv run --python 3.13 ruff check .
      - run: uv run --python 3.13 ruff format --check .
      - run: uv run --python 3.13 pytest -q
