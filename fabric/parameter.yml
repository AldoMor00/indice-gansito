# Reasignacion de referencias entre items al desplegar dev -> prod (fabric-cicd).
#
# La actividad de refresh de pl_gold y pl_mantenimiento no sale del commit con logicalId: guarda el
# workspace y el modelo de dev como GUIDs literales. Se reemplazan por clave, asi que
# ningun GUID de dev vive aqui. Ver docs/plataforma.md.

key_value_replace:
  - find_key: $.properties.activities[?(@.name=="refresh_sm_gansito")].typeProperties.groupId
    replace_value:
      _ALL_: "$workspace.$id"
    item_type: "DataPipeline"
    item_name: "pl_gold"
  - find_key: $.properties.activities[?(@.name=="refresh_sm_gansito")].typeProperties.datasetId
    replace_value:
      _ALL_: "$items.SemanticModel.sm_gansito.$id"
    item_type: "DataPipeline"
    item_name: "pl_gold"
  - find_key: $.properties.activities[?(@.name=="refresh_sm_gansito")].typeProperties.groupId
    replace_value:
      _ALL_: "$workspace.$id"
    item_type: "DataPipeline"
    item_name: "pl_mantenimiento"
  - find_key: $.properties.activities[?(@.name=="refresh_sm_gansito")].typeProperties.datasetId
    replace_value:
      _ALL_: "$items.SemanticModel.sm_gansito.$id"
    item_type: "DataPipeline"
    item_name: "pl_mantenimiento"
  # Los schedules se commitean apagados y se encienden solo en prod: encendidos en dev,
  # el despliegue los llevaria igual y correrian los dos.
  - find_key: $.schedules[?(@.jobType=="Execute")].enabled
    replace_value:
      prod: true
    item_type: "DataPipeline"
    file_path: "**/.schedules"

# El Direct Lake de sm_gansito apunta a OneLake con el workspace y el lh_gold de dev como
# GUIDs literales. Cada regex captura uno solo de los dos.
find_replace:
  - find_value: 'onelake\.dfs\.fabric\.microsoft\.com/([0-9a-f-]{36})/[0-9a-f-]{36}'
    replace_value:
      _ALL_: "$workspace.$id"
    is_regex: "true"
    item_type: "SemanticModel"
    item_name: "sm_gansito"
  - find_value: 'onelake\.dfs\.fabric\.microsoft\.com/[0-9a-f-]{36}/([0-9a-f-]{36})'
    replace_value:
      _ALL_: "$items.Lakehouse.lh_gold.$id"
    is_regex: "true"
    item_type: "SemanticModel"
    item_name: "sm_gansito"
